x-mongo: &mongo
  image: mongo:${MONGO_VERSION}
  restart: always
  container_name: ${CONTAINER_NAME}
  env_file:
    - .env
  hostname: ${MONGO_HOSTNAME}
  networks:
    mongo-net:
      aliases:
        - mongo
        - ${MONGO_HOSTNAME}
  volumes:
    - './data:/data/db'
  logging:
    driver: "json-file"
    options:
      max-size: "15m"
  deploy:
    resources:
      limits:
        memory: ${MONGO_LIMIT_MEMORY:-4G}
        cpus: '${MONGO_LIMIT_CPUS:-2}'
      reservations:
        memory: ${MONGO_RESERVATION_MEMORY:-200M}
        cpus: '${MONGO_RESERVATION_CPUS:-0.5}'
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  mongo-none:
    <<: *mongo
    profiles: [none]

  mongo-host:
    <<: *mongo
    profiles: [host]
    ports:
      - "127.0.0.1:${HOST_MONGO_PORT}:27017"

  mongo-lan:
    <<: *mongo
    profiles: [lan]
    ports:
      - "0.0.0.0:${HOST_MONGO_PORT}:27017"

networks:
  mongo-net:
    name: ${MONGO_NETWORK_NAME:-mongo_network}
